# Failover configuration
failover:
  enabled: true
  max_retries: 3
  retry_delay_ms: 1000
  backoff_multiplier: 2

  # Error codes that trigger failover
  failover_on:
    - 429  # Rate limited
    - 503  # Service unavailable
    - 502  # Bad gateway
    - 500  # Internal server error
    - "rate_limit_exceeded"
    - "overloaded"
    - "capacity"

  # Model tier fallback order
  tier_fallback:
    flagship:
      - anthropic:claude-opus-4-5-20251101
      - openai:gpt-4o
      - google:gemini-1.5-pro
      - alibaba:qwen-max
      - mistral:mistral-large-latest
      - xai:grok-2-latest
      - cohere:command-r-plus
    balanced:
      - anthropic:claude-sonnet-4-20250514
      - google:gemini-1.5-flash
      - alibaba:qwen-plus
      - mistral:mistral-small-latest
      - cohere:command-r
    fast:
      - anthropic:claude-3-5-haiku-20241022
      - openai:gpt-4o-mini
      - google:gemini-2.0-flash
      - alibaba:qwen-turbo
      - groq:llama-3.1-8b-instant
      - deepseek:deepseek-chat
    reasoning:
      - openai:o1
      - deepseek:deepseek-reasoner
      - together:deepseek-ai/DeepSeek-R1
      - fireworks:accounts/fireworks/models/deepseek-r1
    code:
      - mistral:codestral-latest
      - deepseek:deepseek-chat
      - anthropic:claude-sonnet-4-20250514

# Cost tracking
cost_tracking:
  enabled: true
  budget_alert_threshold: 100.00  # USD per day
  budget_hard_limit: 500.00       # USD per day - stop all requests
  log_file: "telemetry/ai-costs.jsonl"

# Repository-specific overrides
repo_overrides:
  # Example: specific repo uses only certain providers
  # "PresidentAnderson/critical-app":
  #   allowed_providers: ["anthropic", "openai"]
  #   preferred_tier: "flagship"
